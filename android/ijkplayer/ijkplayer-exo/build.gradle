apply plugin: 'com.android.library'

android {
    namespace 'tv.danmaku.ijk.media.exo'
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError false
    }
}

dependencies {
    api project(':ijkplayer-java')
    implementation 'androidx.annotation:annotation:1.9.1'

    // Media3 (androidx.media3) — replaces the legacy ExoPlayer r1.5 wrapper.
    api "androidx.media3:media3-exoplayer:$rootProject.ext.media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$rootProject.ext.media3Version"
    implementation "androidx.media3:media3-exoplayer-dash:$rootProject.ext.media3Version"
    implementation "androidx.media3:media3-exoplayer-smoothstreaming:$rootProject.ext.media3Version"
    implementation "androidx.media3:media3-datasource:$rootProject.ext.media3Version"
}
